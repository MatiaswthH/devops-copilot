# broken-app ("payments-api"): simula un incidente real.
# La app necesita la variable de entorno DB_HOST para arrancar,
# pero alguien desplegó SIN definirla -> el contenedor falla
# inmediatamente y Kubernetes lo reinicia: CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          # Simula el arranque de la app: valida su configuración
          # y muere con un error claro si falta DB_HOST.
          command:
            - sh
            - -c
            - |
              echo "payments-api starting..."
              if [ -z "$DB_HOST" ]; then
                echo "FATAL: DB_HOST is not defined. Cannot connect to database." >&2
                exit 1
              fi
              echo "connected to $DB_HOST, serving traffic"
              sleep 3600
          # OJO: aquí debería estar el bloque env: con DB_HOST,
          # pero se desplegó sin él (ese es el incidente).
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: demo
spec:
  selector:
    app: payments-api
  ports:
    - port: 8080
      targetPort: 8080
